# ── Модель ────────────────────────────────────────────────────────────────
[llm]
# ollama | openai | mock
# openai — любой сервер с OpenAI-совместимым /v1/chat/completions
# (llama.cpp server, LM Studio, vLLM, OpenRouter и т.д.)
backend = "ollama"
base_url = "http://127.0.0.1:11434"
model = "qwen3:4b-instruct-2507-q4_K_M"

# Для Ollama не нужен, для внешних API — ключ.
api_key = ""

temperature = 0.85
top_p = 0.95
top_k = 40
min_p = 0.05
repeat_penalty = 1.1
repeat_last_n = 128
max_tokens = 300

# Контекст. Для 4B на CPU 8192 — разумный потолок.
num_ctx = 8192

# 0 = авто. Ollama берёт физические ядра: на 5650U это 6 потоков.
# Принудительные 12 логических на тесте дали 5.0 ток/с против 8.7 —
# SMT для LLM здесь только мешает. На сервере с 20 потоками ставь 8–10,
# чтобы не душить Minecraft.
num_thread = 0

# Отключает "размышления" у Qwen3. Для других моделей можно убрать.
think = false

# Для «думающих» Qwen3 добавляет /no_think в системный промпт.
# Официальная 4B 2507 не думает, поэтому здесь false.
no_think = false

timeout = 300.0

# Сколько держать модель в памяти после ответа:
#   -1   — всегда (быстрый первый токен, ~4 ГБ заняты)
#   "10m" — выгрузить через 10 минут простоя
#   0    — выгружать сразу (каждый раз заново грузить и считать промпт)
keep_alive = -1

# ── Чат ───────────────────────────────────────────────────────────────────
[chat]
# Сколько последних сообщений держать дословно.
# Должно быть больше summarize_after, иначе старые реплики будут
# выпадать из контекста раньше, чем попадут в сводку.
history_messages = 40

# Грубый лимит символов на весь промпт (system + история).
# Для русского ~2.5–3 символа на токен, 18000 ≈ 6000–7000 токенов.
# Оставляем запас под ответ и системный промпт в num_ctx = 8192.
max_context_chars = 18000

# После скольких сообщений без сводки запускать сжатие.
summarize_after = 36

# 0 = обычный потоковый ответ.
# 3 = генерировать 3 заготовки и выбирать вручную.
variants = 0

# "short" — сначала короткие заготовки, после выбора разворот в полную реплику.
# "full"  — сразу полные варианты (полезно для DPO, но дольше).
variant_mode = "short"
short_max_tokens = 60

variant_temperatures = [0.7, 0.9, 1.05]

language = "ru"

# ── Кейсы ─────────────────────────────────────────────────────────────────
[case]
# Сколько вариантов её реплики генерировать в прогоне.
variants = 3
temperatures = [0.7, 0.9, 1.05]

# Сохранять JSON прогона в data/runs/ при завершении.
auto_export = true

# ── Контент ───────────────────────────────────────────────────────────────
[content]
# На этой ветке взрослый режим выключен. Архивная ветка adult — отдельно.
adult = false

# ── Файлы ─────────────────────────────────────────────────────────────────
[paths]
db = "data/chat.db"
preferences = "data/preferences.jsonl"
persona = "persona.md"
exports = "data/exports"

# ── Память ────────────────────────────────────────────────────────────────
[memory]
auto_summarize = true
auto_facts = true
